# Render blueprint for the Artisan's Corner API.
# Create the frontend on Vercel/Netlify (see vercel.json / netlify.toml).
services:
  - type: web
    name: artisans-corner-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Stripe onboarding is invite-only in India, so this deployment runs as a
      # labelled demo: both flags are required, and production refuses to boot
      # with simulated payments otherwise. Once Stripe keys exist, set both to
      # false and fill in the three STRIPE_ values below.
      - key: DEMO_DEPLOYMENT
        value: "true"
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PLATFORM_COMMISSION_RATE
        value: "0.05"
      - key: SHIPPING_FLAT_RATE
        value: "5"
      - key: FREE_SHIPPING_THRESHOLD
        value: "75"
      - key: CURRENCY
        value: usd
      # Set these in the Render dashboard - never commit real values.
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
